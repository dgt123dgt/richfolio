<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richfolio 个股分析</title>
<script src="https://cdn.jsdelivr.net/npm/pako@2/dist/pako.min.js"></script>
<style>
  :root {
    --bg: #eff6ff;
    --card: #ffffff;
    --text: #334155;
    --muted: #64748b;
    --accent: #0ea5e9;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --blue: #3b82f6;
    --border: #e2e8f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .container { max-width: 800px; margin: 0 auto; padding: 20px 16px; }

  /* Header */
  .header {
    background: var(--accent);
    border-radius: 12px 12px 0 0;
    padding: 24px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .ticker-name {
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .ticker-symbol {
    font-size: 13px;
    color: #e0f2fe;
    align-self: flex-end;
    padding-bottom: 4px;
  }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge-strong-buy { background: var(--green); color: #fff; }
  .badge-value {
    font-size: 11px;
    padding: 3px 8px;
  }
  .badge-value-A { background: rgba(34,197,94,0.15); color: #15803d; }
  .badge-value-B { background: rgba(59,130,246,0.15); color: var(--blue); }
  .badge-value-C { background: rgba(245,158,11,0.15); color: #b45309; }
  .badge-value-D { background: rgba(239,68,68,0.15); color: var(--red); }
  .header-meta {
    width: 100%;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 13px;
    color: #e0f2fe;
    margin-top: 4px;
  }
  .confidence-bar {
    display: inline-block;
    width: 80px;
    height: 8px;
    background: rgba(255,255,255,0.35);
    border-radius: 4px;
    vertical-align: middle;
  }
  .confidence-fill {
    height: 100%;
    border-radius: 4px;
    background: #fff;
  }

  /* Card */
  .card {
    background: var(--card);
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .card:last-child { border-radius: 0 0 12px 12px; border-bottom: none; }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--blue);
    margin-bottom: 12px;
  }

  /* Chart */
  .chart-container {
    background: var(--card);
    padding: 0;
    border-bottom: 1px solid var(--border);
    height: 450px;
  }
  .chart-container iframe { border: none; }

  /* Metrics grid */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .metric {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .metric-label { font-size: 11px; color: var(--muted); }
  .metric-value { font-size: 18px; font-weight: 700; color: #1a202c; margin-top: 4px; }
  .metric-value.green { color: var(--green); }
  .metric-value.red { color: var(--red); }
  .metric-value.yellow { color: var(--yellow); }

  /* Buy thesis */
  .thesis p { margin-bottom: 12px; color: var(--text); }

  /* Risks */
  .risk-list { list-style: none; }
  .risk-list li {
    padding: 8px 0 8px 20px;
    position: relative;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .risk-list li::before {
    content: "⚠";
    position: absolute;
    left: 0;
    color: var(--yellow);
  }

  /* Fundamentals */
  .fundamentals-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  /* Action summary */
  .action-box {
    background: rgba(34,197,94,0.07);
    border: 1px solid rgba(34,197,94,0.3);
    border-radius: 8px;
    padding: 16px;
  }
  .action-amount { font-size: 24px; font-weight: 800; color: #1a202c; }
  .action-limit { font-size: 13px; color: #15803d; margin-top: 6px; }
  .action-bottom { font-size: 13px; color: #b45309; margin-top: 4px; }

  /* Footer */
  .footer {
    background: var(--accent);
    border-radius: 0 0 12px 12px;
    padding: 16px 24px;
    text-align: center;
    font-size: 11px;
    color: #e0f2fe;
  }
  .footer a { color: #fff; text-decoration: none; }

  /* Error state */
  .error {
    text-align: center;
    padding: 60px 24px;
    color: var(--muted);
  }
  .error h2 { color: var(--red); margin-bottom: 12px; }

  /* Responsive */
  @media (max-width: 600px) {
    .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    .fundamentals-grid { grid-template-columns: repeat(2, 1fr); }
    .chart-container { height: 350px; }
    .header { padding: 16px; }
    .card { padding: 16px; }
    .ticker-name { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="error" id="error" style="display:none;">
    <h2>无法读取分析数据</h2>
    <p>此链接可能已失效或已损坏。<br>分析数据内嵌在 URL 中 —— 请从邮件里重新打开原始链接。</p>
  </div>
</div>

<script>
// ── Key expansion map (compact → full) ───────────────────────────────
const KEY_MAP = {
  t: 'ticker', n: 'name', d: 'date', a: 'action', c: 'confidence',
  r: 'reason', bt: 'buyThesis', ri: 'risks',
  bv: 'suggestedBuyValue', lp: 'suggestedLimitPrice', lr: 'limitPriceReason',
  vr: 'valueRating', bs: 'bottomSignal', cur: 'currency',
  p: 'price', pe: 'trailingPE', fpe: 'forwardPE',
  h: 'fiftyTwoWeekHigh', l: 'fiftyTwoWeekLow', wp: 'fiftyTwoWeekPercent',
  s50: 'sma50', s200: 'sma200', rsi: 'rsi14',
  ms: 'momentumSignal', gc: 'goldenCross', dc: 'deathCross',
  roe: 'returnOnEquity', de: 'debtToEquity',
  pm: 'profitMargins', rg: 'revenueGrowth', eg: 'earningsGrowth',
  tp: 'targetMeanPrice',
};

function expand(compact) {
  const full = {};
  for (const [k, v] of Object.entries(compact)) {
    full[KEY_MAP[k] || k] = v;
  }
  return full;
}

// ── Chinese display labels ──────────────────────────────────────────
const ACTION_LABELS = {
  'STRONG BUY': '强烈买入',
  'BUY': '买入',
  'HOLD': '持有',
  'WAIT': '观望',
  'TRIM': '减持',
};
const MOMENTUM_LABELS = { bullish: '看多', bearish: '看空', neutral: '中性' };
const VALUE_LABELS = {
  A: '价值 A', B: '价值 B', C: '价值 C', D: '价值 D',
};

// ── Decode URL hash ──────────────────────────────────────────────────
function decodeHash() {
  const hash = window.location.hash.slice(1);
  if (!hash) return null;
  try {
    // base64url → bytes
    const b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
    const pad = b64.length % 4 === 0 ? '' : '='.repeat(4 - b64.length % 4);
    const binary = atob(b64 + pad);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    // inflate
    const json = pako.inflateRaw(bytes, { to: 'string' });
    return expand(JSON.parse(json));
  } catch (e) {
    console.error('Failed to decode analysis data:', e);
    return null;
  }
}

// ── Formatters ──────────────────────────────────────────────────────
function fmt$(n) { return '¥' + Number(n).toLocaleString('zh-CN', { maximumFractionDigits: 0 }); }
// Money in the instrument's own currency. `d.currency` is absent for anything in
// the report currency (kept out of the URL to save bytes), so ¥ is the default;
// a crypto cross-pair sets it and renders as "1,295,840 CRO" instead.
function money(d, n, decimals) {
  const v = Number(n);
  if (!d.currency) {
    return '¥' + v.toFixed(decimals ?? 2);
  }
  // Large whole-unit amounts read better grouped and undecorated.
  const digits = Math.abs(v) >= 1000 ? 0 : (decimals ?? 2);
  return v.toLocaleString('zh-CN', { minimumFractionDigits: digits, maximumFractionDigits: digits }) +
    ' ' + d.currency;
}
function fmtPct(n) { return (n * 100).toFixed(0) + '%'; }
function fmtNum(n, d) { return n != null ? Number(n).toFixed(d ?? 1) : '暂无'; }

function confidenceColor(c) {
  return c >= 70 ? 'var(--green)' : c >= 40 ? 'var(--yellow)' : 'var(--red)';
}

function rsiClass(rsi) {
  if (rsi < 30) return 'green';
  if (rsi > 70) return 'red';
  return '';
}

function momentumColor(m) {
  if (m === 'bullish') return 'green';
  if (m === 'bearish') return 'red';
  return '';
}

// ── TradingView ticker mapping ──────────────────────────────────────
function tvSymbol(ticker) {
  if (ticker === 'BTC' || ticker === 'BTC-USD') return 'COINBASE:BTCUSD';
  if (ticker === 'ETH' || ticker === 'ETH-USD') return 'COINBASE:ETHUSD';
  // A-share: Yahoo style 600519.SS → SSE:600519, 000001.SZ → SZSE:000001
  const m = ticker.match(/^(\d{6})\.(SS|SZ)$/);
  if (m) return (m[2] === 'SS' ? 'SSE:' : 'SZSE:') + m[1];
  return ticker;
}

// ── Repo URL (dynamic for forks via GitHub Pages hostname) ──────────
function repoUrl() {
  const host = window.location.hostname; // e.g. "furic.github.io"
  const owner = host.endsWith('.github.io') ? host.replace('.github.io', '') : 'furic';
  return `https://github.com/${owner}/richfolio`;
}

// ── Render ───────────────────────────────────────────────────────────
function render(d) {
  const displayName = d.name || d.ticker;
  const actionLabel = ACTION_LABELS[d.action] || d.action;
  document.title = `${displayName} — ${actionLabel}分析 | Richfolio`;

  const app = document.getElementById('app');
  const confColor = confidenceColor(d.confidence);

  let html = '';

  // Header
  html += `
  <div class="header">
    <span class="ticker-name">${displayName}</span>
    <span class="ticker-symbol">${d.ticker}</span>
    <span class="badge badge-strong-buy">${actionLabel}</span>
    ${d.valueRating ? `<span class="badge badge-value badge-value-${d.valueRating}">${VALUE_LABELS[d.valueRating] || d.valueRating}</span>` : ''}
    <div class="header-meta">
      <span>
        <span class="confidence-bar"><span class="confidence-fill" style="width:${d.confidence}%;"></span></span>
        &nbsp;置信度 ${d.confidence}%
      </span>
      <span>数据日期 ${d.date}</span>
      <span style="color:#fff;font-weight:700;">${money(d, d.price)}</span>
    </div>
  </div>`;

  // Chart
  const symbol = tvSymbol(d.ticker);
  html += `
  <div class="chart-container">
    <div id="tv-widget-container" class="tradingview-widget-container" style="height:100%;width:100%;">
      <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%;"></div>
    </div>
  </div>`;

  // Key Metrics
  const metrics = [
    { label: '现价', value: money(d, d.price) },
    { label: '市盈率(TTM)', value: d.trailingPE != null ? fmtNum(d.trailingPE) : '暂无' },
    { label: '预期市盈率', value: d.forwardPE != null ? fmtNum(d.forwardPE) : '暂无' },
    { label: '52周位置', value: d.fiftyTwoWeekPercent != null ? fmtPct(d.fiftyTwoWeekPercent) : '暂无',
      cls: d.fiftyTwoWeekPercent != null ? (d.fiftyTwoWeekPercent < 0.3 ? 'green' : d.fiftyTwoWeekPercent > 0.8 ? 'red' : '') : '' },
    { label: 'RSI (14)', value: d.rsi14 != null ? fmtNum(d.rsi14, 0) : '暂无', cls: d.rsi14 != null ? rsiClass(d.rsi14) : '' },
    { label: '50日均线', value: d.sma50 != null ? money(d, d.sma50, 0) : '暂无' },
    { label: '200日均线', value: d.sma200 != null ? money(d, d.sma200, 0) : '暂无' },
    { label: '动量', value: MOMENTUM_LABELS[d.momentumSignal] || d.momentumSignal || '暂无', cls: momentumColor(d.momentumSignal) },
  ];

  html += `
  <div class="card">
    <div class="card-title">关键指标</div>
    <div class="metrics-grid">
      ${metrics.map(m => `
      <div class="metric">
        <div class="metric-label">${m.label}</div>
        <div class="metric-value ${m.cls || ''}">${m.value}</div>
      </div>`).join('')}
    </div>
  </div>`;

  // Buy Thesis
  if (d.buyThesis) {
    const paragraphs = d.buyThesis.split(/\n\n+/).filter(Boolean);
    html += `
    <div class="card thesis">
      <div class="card-title">买入逻辑</div>
      ${paragraphs.map(p => `<p>${p}</p>`).join('')}
    </div>`;
  }

  // Risk Analysis
  if (d.risks && d.risks.length > 0) {
    html += `
    <div class="card">
      <div class="card-title">风险分析</div>
      <ul class="risk-list">
        ${d.risks.map(r => `<li>${r}</li>`).join('')}
      </ul>
    </div>`;
  }

  // Fundamentals (if available)
  const fundEntries = [
    d.returnOnEquity != null ? { label: '净资产收益率', value: (d.returnOnEquity * 100).toFixed(1) + '%', cls: d.returnOnEquity > 0.15 ? 'green' : '' } : null,
    d.debtToEquity != null ? { label: '负债/权益', value: d.debtToEquity.toFixed(1) + '%', cls: d.debtToEquity < 50 ? 'green' : d.debtToEquity > 100 ? 'red' : '' } : null,
    d.profitMargins != null ? { label: '净利率', value: (d.profitMargins * 100).toFixed(1) + '%', cls: d.profitMargins > 0.2 ? 'green' : '' } : null,
    d.revenueGrowth != null ? { label: '营收增速', value: (d.revenueGrowth * 100).toFixed(1) + '%', cls: d.revenueGrowth > 0 ? 'green' : 'red' } : null,
    d.earningsGrowth != null ? { label: '利润增速', value: (d.earningsGrowth * 100).toFixed(1) + '%', cls: d.earningsGrowth > 0 ? 'green' : 'red' } : null,
    d.targetMeanPrice != null ? { label: '分析师目标价', value: money(d, d.targetMeanPrice), cls: d.targetMeanPrice > d.price ? 'green' : 'red' } : null,
  ].filter(Boolean);

  if (fundEntries.length > 0) {
    html += `
    <div class="card">
      <div class="card-title">基本面</div>
      <div class="fundamentals-grid">
        ${fundEntries.map(f => `
        <div class="metric">
          <div class="metric-label">${f.label}</div>
          <div class="metric-value ${f.cls || ''}">${f.value}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }

  // Cross signals
  const signals = [];
  if (d.goldenCross) signals.push('<span style="color:#15803d;">金叉（50日均线 &gt; 200日均线）</span>');
  if (d.deathCross) signals.push('<span style="color:var(--red);">死叉（50日均线 &lt; 200日均线）</span>');
  if (d.bottomSignal) signals.push('<span style="color:#b45309;">见底信号：' + d.bottomSignal + '</span>');
  if (signals.length > 0) {
    html += `
    <div class="card">
      <div class="card-title">技术信号</div>
      <div style="font-size:14px;">${signals.join('<br>')}</div>
    </div>`;
  }

  // Action Summary
  html += `
  <div class="card">
    <div class="card-title">操作建议</div>
    <div class="action-box">
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">建议投入</div>
      <div class="action-amount">${money(d, d.suggestedBuyValue, 0)}</div>
      ${d.suggestedLimitPrice ? `<div class="action-limit">限价建议：${money(d, d.suggestedLimitPrice)}${d.limitPriceReason ? ' —— ' + d.limitPriceReason : ''}</div>` : ''}
      ${d.bottomSignal ? `<div class="action-bottom">见底信号：${d.bottomSignal}</div>` : ''}
    </div>
  </div>`;

  // 52-week range bar
  if (d.fiftyTwoWeekLow != null && d.fiftyTwoWeekHigh != null && d.fiftyTwoWeekPercent != null) {
    html += `
    <div class="card">
      <div class="card-title">52 周区间</div>
      <div style="display:flex;align-items:center;gap:12px;font-size:13px;">
        <span style="color:var(--muted);">${money(d, d.fiftyTwoWeekLow)}</span>
        <div style="flex:1;height:8px;background:var(--border);border-radius:4px;position:relative;">
          <div style="position:absolute;left:${(d.fiftyTwoWeekPercent * 100).toFixed(0)}%;top:-4px;width:4px;height:16px;background:var(--blue);border-radius:2px;transform:translateX(-50%);"></div>
        </div>
        <span style="color:var(--muted);">${money(d, d.fiftyTwoWeekHigh)}</span>
      </div>
      <div style="text-align:center;font-size:12px;color:var(--muted);margin-top:6px;">当前价 ${money(d, d.price)}（距最低点 ${fmtPct(d.fiftyTwoWeekPercent)}）</div>
    </div>`;
  }

  // Refresh Analysis
  html += `
  <div class="card">
    <div class="card-title">复检最新分析</div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">
      用最新价格（含盘前/盘后）重新分析：选择 <strong style="color:var(--text);">refresh</strong> 模式，标的填 <strong style="color:var(--text);">${d.ticker}</strong>：
    </p>
    <a href="${repoUrl()}/actions/workflows/portfolio-monitor.yml" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;gap:8px;background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:12px 16px;font-size:14px;color:var(--blue);text-decoration:none;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      在 GitHub Actions 中运行
    </a>
  </div>`;

  // Footer
  html += `
  <div class="footer">
    <p>本分析由 Google Gemini AI 于 ${d.date} 生成。</p>
    <p style="margin-top:4px;">不构成投资建议，投资前请自行研究判断。</p>
    <p style="margin-top:8px;">由 <a href="${repoUrl()}">Richfolio</a> 提供</p>
  </div>`;

  app.innerHTML = html;

  // TradingView script must be created programmatically — innerHTML doesn't execute <script> tags
  const tvContainer = document.getElementById('tv-widget-container');
  if (tvContainer) {
    const script = document.createElement('script');
    script.type = 'text/javascript';
    script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
    script.async = true;
    script.textContent = JSON.stringify({
      autosize: true,
      symbol: symbol,
      interval: 'D',
      timezone: 'Asia/Shanghai',
      theme: 'light',
      style: '1',
      locale: 'zh_CN',
      backgroundColor: '#ffffff',
      gridColor: 'rgba(226,232,240,0.6)',
      hide_top_toolbar: false,
      hide_legend: false,
      save_image: false,
      calendar: false,
      range: '6M',
      studies: [
        'STD;SMA|v_input_1=50',
        'STD;SMA|v_input_1=200',
        'STD;RSI'
      ],
      support_host: 'https://www.tradingview.com'
    });
    tvContainer.appendChild(script);
  }
}

// ── Init ─────────────────────────────────────────────────────────────
const data = decodeHash();
if (data) {
  render(data);
} else {
  document.getElementById('error').style.display = 'block';
}
</script>
</body>
</html>
